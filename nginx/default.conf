server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docusaurus gera HTML estático por rota. Tenta o arquivo, a versão .html
    # e o diretório; cai na 404 do próprio Docusaurus se não achar.
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }
}
